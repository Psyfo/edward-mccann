# The quality gate CI runs on every push and pull request. It must stay the
# same gate the developer runs locally (`npm run check`), so CI is never the
# first thing to catch a type error.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Public, non-secret. The real value is injected by the deploy
          # pipeline; CI only needs the build to resolve it.
          NEXT_PUBLIC_MEDIA_BASE_URL: https://f005.backblazeb2.com/file/edward-mccann-media
          NEXT_PUBLIC_SITE_URL: https://edwardmccann.studio

  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the design intelligence package is intact
        run: |
          required=(
            README.md executive-summary.md design-handoff.md brand-analysis.md
            content-analysis.md information-architecture.md ux-analysis.md
            visual-analysis.md responsive-analysis.md interaction-analysis.md
            photography-analysis.md typography-analysis.md colour-analysis.md
            design-system-analysis.md technical-analysis.md
            competitive-positioning.md opportunities.md risks-and-constraints.md
            recommended-design-direction.md page-inventory.md
            component-inventory.md asset-inventory.md copy-inventory.md
            screenshot-index.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "design-intelligence/$f" ]; then
              echo "MISSING: design-intelligence/$f"
              missing=1
            fi
          done
          exit $missing
