<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <title>Edward McCann Architecture</title>
  <!-- The practice's own EM monogram, kept from the previous identity and
       redrawn as vector from the apple-touch-icon the old site served. Same
       geometry, now sharp at any size; only the palette moved to the brand's
       ink and paper. The mark bleeds to the left and right edges by design.
       Variants live in public/brand/. -->
  <rect width="180" height="180" fill="#F5F2ED"/>
  <g fill="#161412">
    <rect x="0" y="40" width="69.5" height="20.5"/>
    <rect x="0" y="78" width="42.5" height="21.5"/>
    <rect x="0" y="119" width="69.5" height="20.5"/>
    <polygon points="79.5,40 101.5,40 131.5,110.5 119.5,139.5"/>
    <rect x="158" y="40" width="22" height="100"/>
  </g>
</svg>
