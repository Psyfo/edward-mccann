<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Edward McCann Architecture</title>
  <!-- The EM plan-monogram (logo board, candidate 02): stencil E and M drawn on
       one grid at a single construction weight. Rotate the E and it reads as a
       plan: two walls and three floor plates. -->
  <rect width="100" height="100" fill="#161412"/>
  <g fill="#F5F2ED">
    <rect x="14" y="14" width="10" height="72"/>
    <rect x="14" y="14" width="36" height="10"/>
    <rect x="14" y="45" width="29" height="10"/>
    <rect x="14" y="76" width="36" height="10"/>
    <rect x="57" y="14" width="10" height="72"/>
    <rect x="76" y="14" width="10" height="72"/>
    <rect x="67" y="14" width="9" height="10"/>
  </g>
</svg>
